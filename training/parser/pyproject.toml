[project]
name = "writinglint-parser-training"
version = "0.1.0"
description = "Train and evaluate WritingLint's compact owned UD parser."
requires-python = ">=3.12,<3.13"
dependencies = [
  "conllu>=6,<7",
  "numpy>=2,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.22,<2",
  "protobuf>=6,<7",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.7,<3",
  "transformers>=4.52,<6",
  "tqdm>=4.67,<5",
]

[dependency-groups]
quality = [
  "mypy>=2.3,<3",
  "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# The lightweight quality environment intentionally omits the multi-gigabyte
# ML runtime. Owned functions remain strict; imported framework decorators and
# nn.Module bases are exercised in the full training environment instead.
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
