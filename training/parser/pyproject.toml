[project]
name = "writinglint-parser-training"
version = "0.1.0"
description = "Train and evaluate WritingLint's compact owned UD parser."
requires-python = ">=3.12,<3.13"
dependencies = [
  "conllu>=6,<7",
  "numpy>=2,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.22,<2",
  "protobuf>=6,<7",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.7,<3",
  "transformers>=4.52,<6",
  "tqdm>=4.67,<5",
]

[tool.uv]
package = false
