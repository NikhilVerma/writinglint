name: Deploy

# Builds the site and deploys the Worker (static assets + R2-backed /model & /ort)
# to Cloudflare on every push to main. No dashboard "Connect to Git" — the first
# `wrangler deploy` creates the Worker via the API token.
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" + Workers R2 read
#   CLOUDFLARE_ACCOUNT_ID  — your account id
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run setup-model
      - run: npm run check
      - run: npm run build:cf
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
