name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Node.js 20 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run setup-model
      - run: npm test
      - run: npm run pack:check

  quality:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run setup-model
      - run: npm run check

  packages:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run pack:check
      - name: Install packed CLI in an isolated consumer project
        run: npm run smoke:packed

  applications:
    name: Build sites and VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run check -w sloplint-chrome-extension
      - run: npm run build -w sloplint-chrome-extension
      - run: npm run smoke -w sloplint-chrome-extension
      - run: npm run build:site -w writinglint-web
      - run: npm run build -w sloplint-web
      - run: npm run package -w sloplint-vscode
