name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python lint, types, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: '0.11.28'
          enable-cache: true
          cache-dependency-glob: training/parser/uv.lock
      - name: Install lightweight quality tools
        run: uv sync --project training/parser --frozen --only-group quality
      - name: Lint Python
        run: >-
          uv run --project training/parser --only-group quality ruff check
          training/parser packages/parser-node/python experiments/stanza/parse.py
      - name: Check Python formatting
        run: >-
          uv run --project training/parser --only-group quality ruff format --check
          training/parser packages/parser-node/python experiments/stanza/parse.py
      - name: Type-check Python
        run: >-
          uv run --project training/parser --only-group quality mypy
          --config-file training/parser/pyproject.toml
          training/parser packages/parser-node/python experiments/stanza/parse.py
      - name: Run dependency-free Python unit tests
        working-directory: training/parser
        run: python -m unittest discover -p 'test_*.py'

  compatibility:
    name: Node.js 20 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run setup-model
      - run: npm test
      - run: npm run pack:check

  quality:
    name: Test, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run setup-model
      - run: npm run check

  packages:
    name: Package smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run pack:check
      - name: Install packed CLI in an isolated consumer project
        run: npm run smoke:packed

  applications:
    name: Build sites and VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run check -w slopsift-chrome-extension
      - run: npm run build -w slopsift-chrome-extension
      - run: npm run smoke -w slopsift-chrome-extension
      - run: npm run build:site -w writinglint-web
      - run: npm run build -w slopsift-web
      - run: npm run package -w slopsift-vscode
      - name: Test SlopSift in a VS Code extension host
        run: xvfb-run -a npm run test:integration -w slopsift-vscode
