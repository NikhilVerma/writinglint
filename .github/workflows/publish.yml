name: Publish npm packages

on:
  push:
    branches: [main]
    paths:
      - "packages/*/package.json"
      - ".github/workflows/publish.yml"
      - "scripts/detect-package-release.mjs"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Detect public package version changes
        id: release
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/detect-package-release.mjs
      - name: Use an OIDC-compatible npm version
        if: steps.release.outputs.needed == 'true'
        run: npm install --global npm@11.6.1
      - if: steps.release.outputs.needed == 'true'
        run: npm ci
      - name: Verify packed packages in an isolated consumer project
        if: steps.release.outputs.needed == 'true'
        run: npm run smoke:packed
      - name: Verify and publish unpublished versions
        if: steps.release.outputs.needed == 'true'
        run: npm run release
      - name: Install and run the published SlopSift package
        if: steps.release.outputs.needed == 'true'
        run: npm run smoke:published
      - name: Ensure verified package tags exist
        if: steps.release.outputs.needed == 'true'
        run: node scripts/ensure-release-tags.mjs
      - name: Push verified package tags
        if: steps.release.outputs.needed == 'true'
        # The packed and public-registry gates have already passed. Avoid
        # rerunning the local pre-push package build for this tag-only push.
        env:
          HUSKY: 0
        run: git push origin --tags
      - name: Verify release tags reached GitHub
        if: steps.release.outputs.needed == 'true'
        run: node scripts/ensure-release-tags.mjs --verify-remote
