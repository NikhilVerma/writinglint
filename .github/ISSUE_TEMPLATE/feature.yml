name: Feature proposal
description: Propose a focused rule, integration, API, or product improvement.
title: "proposal: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sloplint CLI
        - Rule or rulepack
        - Public API
        - Parser or model
        - Chrome extension
        - VS Code extension
        - Website or documentation
        - Release or contributor tooling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem exists today? Concrete examples are useful.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe behavior and UX, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the TODO for related work.
          required: true
